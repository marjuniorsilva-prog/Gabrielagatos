<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c85d99" />
  <meta name="description" content="Contato de Gabriela Souza. Caso encontre meu animal, entre em contato." />
  <title>Gabriela Souza | Contato</title>
  <!-- Versão autocontida: foto e contato incorporados neste arquivo -->
  <style>
    :root{
      --rose:#cf5f9d;
      --rose-dark:#4b2c3d;
      --text:#111111;
      --muted:#767676;
      --line:#ececec;
      --soft:#f8f8f8;
      --card:#ffffff;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      color:var(--text);
      background:#fff;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    a{color:inherit;text-decoration:none}
    button{font:inherit}
    .page{min-height:100vh;background:#fff}

    .hero{
      position:relative;
      min-height:338px;
      background:linear-gradient(180deg,var(--rose-dark) 0%, #8a416b 48%, var(--rose) 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:42px 20px 54px;
      overflow:visible;
    }
    .hero::after{
      content:"";
      position:absolute;
      left:-2%;
      right:-2%;
      bottom:-2px;
      height:48px;
      background:#fff;
      border-radius:50% 50% 0 0 / 30% 30% 0 0;
      transform:translateY(58%);
      z-index:0;
    }
    .profile{
      position:relative;
      z-index:2;
      text-align:center;
      margin-top:12px;
    }
    .avatar{
      width:122px;
      height:122px;
      object-fit:cover;
      object-position:center 20%;
      border-radius:50%;
      border:7px solid #fff;
      box-shadow:0 4px 18px rgba(0,0,0,.08);
      display:block;
      margin:0 auto 30px;
    }
    .name{
      margin:0;
      font-size:29px;
      line-height:1.1;
      font-weight:700;
      letter-spacing:-.6px;
    }

    .quick-actions{
      position:absolute;
      left:50%;
      bottom:-29px;
      transform:translateX(-50%);
      display:flex;
      gap:28px;
      z-index:5;
    }
    .quick-actions a{
      width:62px;
      height:62px;
      border-radius:50%;
      background:#fff;
      display:grid;
      place-items:center;
      box-shadow:0 12px 30px rgba(0,0,0,.08);
      transition:transform .15s ease, box-shadow .15s ease;
    }
    .quick-actions a:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.12)}
    .quick-actions svg{width:25px;height:25px;stroke:#111;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}

    .content{
      width:min(670px, calc(100% - 32px));
      margin:0 auto;
      padding:84px 0 44px;
    }
    .message{
      text-align:center;
      margin:0 0 30px;
      font-size:18px;
      font-weight:400;
      color:#666;
      letter-spacing:.15px;
      line-height:1.4;
    }
    .contact-card{
      background:var(--card);
      box-shadow:0 8px 30px rgba(0,0,0,.035);
      padding:12px 20px;
      border-radius:3px;
    }
    .row{
      display:grid;
      grid-template-columns:44px 1fr;
      gap:12px;
      align-items:center;
      min-height:72px;
      border-bottom:1px solid var(--line);
    }
    .row:last-child{border-bottom:none;padding:2px 0 12px}
    .mini-icon{
      width:40px;
      height:40px;
      border-radius:50%;
      background:#fafafa;
      display:grid;
      place-items:center;
      color:#9da0a5;
    }
    .mini-icon svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .label{
      display:block;
      color:#868686;
      font-size:12px;
      margin-bottom:4px;
      line-height:1.2;
    }
    .value{
      font-size:16px;
      line-height:1.35;
      word-break:break-word;
    }
    .map-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      margin-top:12px;
      min-height:30px;
      padding:0 16px;
      border-radius:18px;
      background:#eef7f7;
      color:#5c6668;
      font-size:11px;
      transition:background .15s ease;
    }
    .map-btn:hover{background:#e6f2f2}
    .add-contact{
      margin-top:20px;
      min-height:48px;
      width:100%;
      border-radius:3px;
      background:var(--rose);
      display:grid;
      grid-template-columns:56px 1fr 56px;
      align-items:center;
      font-size:14px;
      color:#050505;
      transition:filter .15s ease, transform .15s ease;
    }
    .add-contact:hover{filter:brightness(.98);transform:translateY(-1px)}
    .add-contact svg{width:20px;height:20px;stroke:#111;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;justify-self:center}
    .add-contact span{grid-column:2;text-align:center}

    @media (max-width: 700px){
      .hero{min-height:320px;padding-top:38px}
      .avatar{width:112px;height:112px;margin-bottom:26px}
      .name{font-size:25px}
      .content{padding-top:78px;width:min(100% - 26px, 670px)}
      .message{font-size:16px;margin-bottom:24px}
      .contact-card{padding:8px 16px}
    }

    @media (max-width: 420px){
      .hero{min-height:294px;padding:28px 16px 48px}
      .avatar{width:98px;height:98px;border-width:6px;margin-bottom:22px}
      .name{font-size:22px}
      .quick-actions{gap:18px;bottom:-27px}
      .quick-actions a{width:56px;height:56px}
      .quick-actions svg{width:23px;height:23px}
      .content{padding-top:72px;width:calc(100% - 22px)}
      .message{font-size:15px;line-height:1.45;padding:0 3px}
      .contact-card{padding:6px 14px}
      .row{grid-template-columns:40px 1fr;gap:10px;min-height:68px}
      .mini-icon{width:36px;height:36px}
      .label{font-size:11px}
      .value{font-size:14px}
      .add-contact{min-height:50px}
    }
  </style>
</head>
